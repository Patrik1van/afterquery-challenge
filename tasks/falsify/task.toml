schema_version = "1.3"

artifacts = [
    { source = "/app/answer.json" },
    { source = "/var/log/lab/queries.jsonl", service = "lab" },
    { source = "/var/log/lab/model.json", service = "lab" },
    { source = "/var/log/lab/puzzles.json", service = "lab" },
]

[task]
name = "afterquery-challenge/falsify"
description = "Two phases: identify nine hidden binary operators with a budget of 20 points and commit a model of them, then the lab locks and reveals operator-and-parenthesis puzzles, some of which have no solution."
authors = []
keywords = ["hypothesis-testing", "experimental-design", "arithmetic", "sidecar"]

[metadata]
difficulty = "medium"
category = "reasoning"
tags = ["experiment-design", "hidden-rules", "budget", "two-phase", "committed-model", "unsolvable-puzzles", "calibration"]

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0

[verifier.env]

[environment.env]

[solution.env]
