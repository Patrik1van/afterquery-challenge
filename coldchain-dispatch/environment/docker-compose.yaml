services:
  main:
    depends_on:
      sim:
        condition: service_healthy
  sim:
    build:
      context: ./sim
    environment:
      LEVEL: "medium"
      SEED: "1"
      VERIFY_TOKEN: "REPLACE_TOKEN"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
